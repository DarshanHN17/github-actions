name: Complete Pipeline

on:
  push:
    branches: ['main']

permissions:
  contents: read
  pages: write
  id-token: write             # ✅ Fixed: was id-tocken

concurrency:
  group: 'pages'              # ✅ Fixed: was groups
  cancel-in-progress: false   # ✅ Fixed: was cancel-in-progess

jobs:

  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5  # ✅ Fixed: was action/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Lints
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  Test:
    runs-on: ubuntu-latest
    needs: ['Lint']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5  # ✅ Fixed: was action/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Testing Code
        run: pytest -vv

  Build:
    runs-on: ubuntu-latest
    needs: ['Test']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir build
          cp app.py build/
          cp requirements.txt build/
          ls -la build/

      - name: Uploading artifacts
        uses: actions/upload-artifact@v4  # ✅ Fixed: was upload-actifact@v4
        with:
          name: python-build-${{ github.run_number }}
          path: build/
          retention-days: 7

  Deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4        # ✅ Fixed: was run: actions/checkout@v4

      - name: Configure pages
        uses: actions/configure-pages@v4

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deployment
        id: deployment
        uses: actions/deploy-pages@v4
