name: GitHub Page Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false



jobs:
  Check:
    name: ENV check
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
    - name: Show name
      env:
        MY_name: ${{secrets.MY_NAME}}
      run: echo " Name is  $MY_name"

  Build:
    name: Building Files
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Setup Pages
      uses: actions/configure-pages@v4
    - name: Upload data
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/
  Deploy:
    name: Deployment
    runs-on: ubuntu-latest
    needs: [Build]
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    steps:
    - name: Deploy to github-pages
      id: deployment
      uses: actions/deploy-pages@v4
