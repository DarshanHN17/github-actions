name: Parallel Jobs

on: [push]

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
    - name: lint
      run: |
        echo "Lint"
        sleep 10
  Test:
    runs-on: ubuntu-latest
    needs: [Lint]
    steps:
    - name: Test
      run: |
        echo "Test"
        sleep 10
  Build:
    runs-on: ubuntu-latest
    needs: [Test]
    steps:
    - name: Build
      run: |
        echo "Build"
        sleep 10
  Deploy-Sim:
    runs-on: ubuntu-latest
    needs: [Build]
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Deploy-sim
      run: |
        echo "Deploy Sim"
